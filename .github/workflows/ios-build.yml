name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project TomkaCamera.xcodeproj \
            -scheme TomkaCamera \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: TomkaCamera-unsigned
          path: build/Build/Products/Release-iphoneos/TomkaCamera.app
